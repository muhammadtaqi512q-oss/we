name: Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write     # commit + push ke liye zaroori

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Create script.js from secret
        env:
          MY_SECURE_SCRIPT: ${{ secrets.MY_SECURE_SCRIPT }}
        run: |
          printf '%s\n' "$MY_SECURE_SCRIPT" > script.js
          echo "File size: $(wc -c < script.js) bytes"

      - name: Commit and push script.js
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add script.js
          # agar change nahi hua to commit skip
          git diff --cached --quiet || git commit -m "chore: update script.js from secret"
          git push
