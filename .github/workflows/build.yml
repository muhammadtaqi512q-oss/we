name: Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:   # manual run ke liye

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Create script.js from secret
        env:
          MY_SECURE_SCRIPT: ${{ secrets.MY_SECURE_SCRIPT }}
        run: |
          printf '%s' "$MY_SECURE_SCRIPT" > script.js

      - name: Verify file (optional)
        run: |
          echo "Lines: $(wc -l < script.js)"
          head -n 5 script.js
